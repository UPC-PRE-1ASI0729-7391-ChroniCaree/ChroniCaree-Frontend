<div class="nudges-page-container">
  <!-- Header -->
  <div class="page-header">
    <div class="header-content">
      <button mat-icon-button routerLink="/patient/dashboard" class="back-button">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="header-text">
        <h1>Recordatorios</h1>
        <p>Gestiona tus notificaciones y recordatorios importantes</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="stat-card">
        <mat-icon class="stat-icon">notifications_active</mat-icon>
        <div class="stat-content">
          <span class="stat-value">{{ activeCount() }}</span>
          <span class="stat-label">Activos</span>
        </div>
      </div>
      <button mat-raised-button color="primary" (click)="toggleCreateForm()" class="create-btn">
        <mat-icon>add</mat-icon>
        Crear Recordatorio
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="page-content">
    @if (loading()) {
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Cargando recordatorios...</p>
      </div>
    } @else {
      <div class="nudges-full-panel">
        <!-- Quick create form -->
        @if (showCreateForm) {
          <div class="create-reminder-form">
            <div class="form-row">
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>Título</mat-label>
                <input matInput placeholder="Ej: Tomar medicamento" [(ngModel)]="createTitle" />
              </mat-form-field>
              <mat-form-field appearance="outline" class="form-field form-field-wide">
                <mat-label>Mensaje</mat-label>
                <input matInput placeholder="Detalles del recordatorio" [(ngModel)]="createMessage" />
              </mat-form-field>
            </div>
            <div class="form-row">
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>Prioridad</mat-label>
                <mat-select [(ngModel)]="createPriority">
                  <mat-option [value]="'low'">🟢 Baja</mat-option>
                  <mat-option [value]="'medium'">🟡 Media</mat-option>
                  <mat-option [value]="'high'">🟠 Alta</mat-option>
                  <mat-option [value]="'urgent'">🔴 Urgente</mat-option>
                </mat-select>
              </mat-form-field>
              <div class="form-actions">
                <button mat-raised-button color="primary" (click)="createNudge()">
                  <mat-icon>check</mat-icon>
                  Guardar
                </button>
                <button mat-button (click)="toggleCreateForm()">
                  <mat-icon>close</mat-icon>
                  Cancelar
                </button>
              </div>
            </div>
          </div>
        }

        <app-nudge-panel />
      </div>
    }
  </div>
</div>
