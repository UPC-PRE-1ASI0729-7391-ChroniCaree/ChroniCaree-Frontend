<header class="header">
  <div class="header-container">
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="search" 
          placeholder="Buscar pacientes, doctores, citas..." 
          class="search-input"
        />
      </div>
    </div>

    <!-- Actions Section -->
    <div class="actions-section">
      <!-- Language Switcher -->
      <app-language-switcher />

      <!-- Notifications -->
      <div class="action-item">
        <button 
          class="action-btn" 
          (click)="toggleNotifications()"
          aria-label="Notificaciones">
          <span class="icon">🔔</span>
          <span class="badge" *ngIf="getUnreadCount() > 0">{{ getUnreadCount() }}</span>
        </button>

        <ng-container *ngIf="showNotifications()">
          <div class="dropdown notifications-dropdown">
            <div class="dropdown-header">
              <h3>Notificaciones</h3>
              <span class="badge-count">{{ getUnreadCount() }} nuevas</span>
            </div>
            <ul class="notifications-list">
              <li *ngFor="let notification of notifications()" class="notification-item" [class.unread]="notification.unread">
                <span class="notification-dot" *ngIf="notification.unread"></span>
                <p class="notification-text">{{ notification.message }}</p>
              </li>
            </ul>
            <div class="dropdown-footer">
              <a href="#" class="link">Ver todas las notificaciones</a>
            </div>
          </div>
        </ng-container>
      </div>

      <!-- User Menu -->
      <div class="action-item">
        <button 
          class="user-btn" 
          (click)="toggleUserMenu()"
          aria-label="Menú de usuario">
          <span class="user-avatar">{{ currentUser().avatar }}</span>
          <div class="user-info">
            <span class="user-name">{{ currentUser().name }}</span>
            <span class="user-role">{{ currentUser().role }}</span>
          </div>
          <span class="chevron">▼</span>
        </button>

        <ng-container *ngIf="showUserMenu()">
          <div class="dropdown user-dropdown">
            <div class="dropdown-header">
              <div class="user-profile">
                <span class="avatar-large">{{ currentUser().avatar }}</span>
                <div>
                  <h4>{{ currentUser().name }}</h4>
                  <p class="text-small">{{ currentUser().role }}</p>
                </div>
              </div>
            </div>
            <ul class="menu-list">
              <li><a [routerLink]="getProfileRoute()" (click)="closeMenus()" class="menu-link">👤 Mi Perfil</a></li>
              <li><a href="#" class="menu-link">⚙️ Configuración</a></li>
              <li><a href="#" class="menu-link">❓ Ayuda</a></li>
              <li class="divider"></li>
              <li><button (click)="logout()" class="menu-link logout">🚪 Cerrar Sesión</button></li>
            </ul>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</header>
