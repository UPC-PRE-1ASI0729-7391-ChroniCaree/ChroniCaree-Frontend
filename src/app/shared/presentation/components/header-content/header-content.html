<header class="header">
  <div class="header-container">
    <!-- Actions Section -->
    <div class="actions-section">
      <app-language-switcher></app-language-switcher>
      <div class="action-item">
        <button
          class="user-btn"
          (click)="toggleUserMenu()"
          aria-label="Menú de usuario">
          <span class="user-avatar">{{ currentUser().avatar }}</span>
          <div class="user-info">
            <span class="user-name">{{ currentUser().name }}</span>
            <span class="user-role">
              {{ ('roles.' + currentUser().role) | translate }}
            </span>
          </div>
          <span class="chevron">▼</span>
        </button>

        <ng-container *ngIf="showUserMenu()">
          <div class="dropdown user-dropdown">
            <div class="dropdown-header">
              <div class="user-profile">
                <span class="avatar-large">{{ currentUser().avatar }}</span>
                <div>
                  <h4>{{ currentUser().name }}</h4>
                  <p class="text-small">
                    {{ ('roles.' + currentUser().role) | translate }}
                  </p>
                </div>
              </div>
            </div>

            <ul class="menu-list">
              <li>
                <a
                  [routerLink]="getProfileRoute()"
                  (click)="closeMenus()"
                  class="menu-link">
                  👤 {{ 'header.menu.profile' | translate }}
                </a>
              </li>

              <!-- Ayuda solo visible para pacientes -->
              <li *ngIf="isPatient()">
                <a
                  [routerLink]="'/tutorial'"
                  (click)="closeMenus()"
                  class="menu-link">
                  ❓ {{ 'header.menu.help' | translate }}
                </a>
              </li>

              <li class="divider"></li>

              <li>
                <button
                  (click)="logout()"
                  class="menu-link logout">
                  🚪 {{ 'common.logout' | translate }}
                </button>
              </li>
            </ul>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</header>
