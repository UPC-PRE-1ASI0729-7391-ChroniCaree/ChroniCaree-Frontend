<aside
  class="sidebar sidebar-doctor"
  data-toolbar="doctor"
  role="navigation"
  [attr.aria-label]="'navigation.doctor.ariaLabel' | translate"
>
  <!-- Brand -->
  <div class="sidebar-header">
    <!-- Non-clickable white logo/text per design request -->
    <div class="logo" aria-label="ChroniCaree" role="img">
      <img src="assets/img/logo-chroni.png" alt="ChroniCaree" class="logo-img" />
      <span class="logo-text">ChroniCaree</span>
    </div>
  </div>

  <!-- Main navigation -->
  <nav class="nav-menu">
    <!-- Dashboard -->
    <a
      class="nav-item"
      routerLink="/doctor/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      [title]="'navigation.doctor.dashboard' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>{{ 'navigation.doctor.dashboard' | translate }}</span>
    </a>

    <!-- Pacientes -->
    <a [routerLink]="['/doctor/patients']" routerLinkActive="active" class="nav-item" [title]="'navigation.doctor.patients' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>{{ 'navigation.doctor.patients' | translate }}</span>
    </a>

    <!-- Citas -->
    <a [routerLink]="['/doctor/appointments']" routerLinkActive="active" class="nav-item" [title]="'navigation.doctor.appointments' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>{{ 'navigation.doctor.appointments' | translate }}</span>
    </a>

    <!-- Historiales -->
    <a [routerLink]="['/doctor/records']" routerLinkActive="active" class="nav-item" [title]="'navigation.doctor.records' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>{{ 'navigation.doctor.records' | translate }}</span>
    </a>

    <!-- Mensajes (doctor) -->
    <a
      class="nav-item"
      routerLink="/communication/messages"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      [title]="'navigation.doctor.messages' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span
        [matBadge]="messagesStore.urgentThreads().length > 0 ? messagesStore.urgentThreads().length : messagesStore.totalThreads()"
        [matBadgeHidden]="messagesStore.totalThreads() === 0"
        [matBadgeColor]="messagesStore.urgentThreads().length > 0 ? 'warn' : 'primary'"
        matBadgeSize="small">
        {{ 'navigation.doctor.messages' | translate }}
      </span>
    </a>
  </nav>

  <!-- Footer actions -->
  <div class="sidebar-footer">
    <button class="nav-item logout" type="button" (click)="logout()" [title]="'common.logout' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>{{ 'common.logout' | translate }}</span>
    </button>
  </div>
</aside>
