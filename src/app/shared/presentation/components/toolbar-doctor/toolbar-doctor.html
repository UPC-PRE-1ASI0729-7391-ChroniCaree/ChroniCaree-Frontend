<aside
  class="sidebar sidebar-doctor"
  data-toolbar="doctor"
  role="navigation"
  aria-label="Menú del médico"
>
  <!-- Brand -->
  <div class="sidebar-header">
    <a class="logo" routerLink="/doctor/dashboard" aria-label="Ir al dashboard">
      <img src="assets/img/logo-chroni.png" alt="ChroniCaree" class="logo-img" />
      <span class="logo-text">ChroniCaree</span>
    </a>
  </div>

  <!-- Main navigation -->
  <nav class="nav-menu">
    <!-- Dashboard -->
    <a
      class="nav-item"
      routerLink="/doctor/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Dashboard"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Dashboard</span>
    </a>

    <a [routerLink]="['/doctor/patients']" routerLinkActive="active" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Pacientes</span>
    </a>


    <a [routerLink]="['/doctor/appointments']" routerLinkActive="active" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>

      </svg>
      <span>Citas</span>
    </a>

    <a [routerLink]="['/doctor/records']" routerLinkActive="active" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Historiales</span>
    </a>

    <!-- Dispositivos IoT (placeholder) -->
    <a
      class="nav-item"
      routerLink="/coming-soon"
      routerLinkActive="active"
      title="Dispositivos IoT"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6m8.66-12-3 3m-9.32 9.32-3 3m16.32 0-3-3m-9.32-9.32-3-3"></path>
      </svg>
      <span>Dispositivos IoT</span>
    </a>

    <!-- Mensajes (doctor) -->
    <a
      class="nav-item"
      routerLink="/doctor/messages"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Mensajes"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Mensajes</span>
    </a>
  </nav>

  <!-- Footer actions -->
  <div class="sidebar-footer">
    <a
      class="nav-item"
      routerLink="/coming-soon"
      routerLinkActive="active"
      title="Configuración"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 9h.09A1.65 1.65 0 0 0 10 7.49V7a2 2 0 1 1 4 0v.49A1.65 1.65 0 0 0 15 9h.09a1.65 1.65 0 0 0 1.51-1l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 15Z"
        ></path>
      </svg>
      <span>Configuración</span>
    </a>

    <button class="nav-item logout" type="button" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>
