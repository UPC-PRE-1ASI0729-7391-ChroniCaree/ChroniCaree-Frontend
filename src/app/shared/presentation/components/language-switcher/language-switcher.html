<div class="language-switcher">
  <button 
    class="language-btn" 
    (click)="toggleDropdown()"
    aria-label="Cambiar idioma">
    <span class="flag">{{ currentLanguage.flag }}</span>
    <span class="language-code">{{ currentLanguage.code | uppercase }}</span>
    <span class="chevron">▼</span>
  </button>

  <ng-container *ngIf="showDropdown">
    <div class="dropdown">
      <ul class="language-list">
        <li *ngFor="let language of languages">
          <button 
            class="language-option"
            [class.active]="language.code === currentLanguage.code"
            (click)="selectLanguage(language)">
            <span class="flag">{{ language.flag }}</span>
            <span class="language-name">{{ language.name }}</span>
            <span class="checkmark" *ngIf="language.code === currentLanguage.code">✓</span>
          </button>
        </li>
      </ul>
    </div>
  </ng-container>
</div>
