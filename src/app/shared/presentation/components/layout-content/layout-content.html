<!-- Full Screen Mode (for IAM routes) -->
@if (isFullScreen()) {
  <router-outlet />
}

<!-- Normal Layout (with header/footer/toolbar) -->
@if (!isFullScreen()) {
  <div class="layout">
    <!-- Sidebar/Toolbar -->
    <app-toolbar-content />

    <!-- Main Content Area -->
    <div class="layout-main">
      <!-- Header -->
      <app-header-content />

      <!-- Page Content -->
      <main class="content">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer-content />
    </div>
  </div>
}
