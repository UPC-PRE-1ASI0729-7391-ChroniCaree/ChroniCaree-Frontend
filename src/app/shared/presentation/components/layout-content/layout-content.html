<ng-container *ngIf="isFullScreen(); else withLayout">
  <router-outlet />
</ng-container>

<ng-template #withLayout>
  <div
    class="layout"
    [class.role-doctor]="userRole() === 'doctor'"
    [class.role-admin]="userRole() === 'hospital_admin'"
    [class.role-patient]="userRole() === 'patient'"
    [attr.data-role]="userRole() || 'guest'">

    <!-- Sidebar / Toolbar by role -->
    <ng-container *ngIf="userRole() === 'doctor'">
      <app-toolbar-doctor />
    </ng-container>
    <ng-container *ngIf="userRole() === 'hospital_admin'">
      <app-toolbar-admin />
    </ng-container>
    <ng-container *ngIf="userRole() === 'patient'">
      <app-toolbar-patient />
    </ng-container>
    <ng-container *ngIf="!userRole() || (userRole() !== 'doctor' && userRole() !== 'hospital_admin' && userRole() !== 'patient')">
      <div class="no-sidebar-placeholder" aria-hidden="true"></div>
    </ng-container>

    <!-- Main column -->
    <div class="layout-main">
      <!-- Header -->
      <app-header-content />

      <!-- Routed page content -->
      <main class="content" role="main">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer-content />
    </div>
  </div>
</ng-template>
