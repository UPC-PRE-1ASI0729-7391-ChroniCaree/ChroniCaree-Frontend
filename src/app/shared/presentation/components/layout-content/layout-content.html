@if (isFullScreen()) {
  <router-outlet />
} @else {
  <div
    class="layout"
    [class.role-doctor]="userRole() === 'doctor' || userRole() === 'hospital_admin'"
    [class.role-patient]="userRole() === 'patient'"
    [attr.data-role]="userRole() || 'guest'">

    <!-- Sidebar / Toolbar by role -->
    @if (userRole() === 'doctor' || userRole() === 'hospital_admin') {
      <app-toolbar-doctor />
    } @else if (userRole() === 'patient') {
      <app-toolbar-patient />
    } @else {
      <div class="no-sidebar-placeholder" aria-hidden="true"></div>
    }

    <!-- Main column -->
    <div class="layout-main">
      <!-- Header -->
      <app-header-content />

      <!-- Routed page content -->
      <main class="content" role="main">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer-content />
    </div>
  </div>
}
