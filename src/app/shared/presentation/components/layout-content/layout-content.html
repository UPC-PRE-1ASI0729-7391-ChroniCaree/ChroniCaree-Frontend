<!-- Full Screen Mode (for IAM routes) -->
@if (isFullScreen()) {
  <router-outlet />
}

<!-- Normal Layout (with header/footer/toolbar) -->
@if (!isFullScreen()) {
  <div class="layout">
    <!-- Sidebar/Toolbar - Different for each role -->
    @if (userRole() === 'doctor' || userRole() === 'hospital_admin') {
      <app-toolbar-doctor />
    } @else if (userRole() === 'patient') {
      <app-toolbar-patient />
    } @else {
      <!-- No toolbar if no role (user not logged in) -->
      <div class="no-sidebar-placeholder"></div>
    }

    <!-- Main Content Area -->
    <div class="layout-main">
      <!-- Header -->
      <app-header-content />

      <!-- Page Content -->
      <main class="content">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer-content />
    </div>
  </div>
}
