<ng-container *ngIf="isFullScreen(); else withLayout">
  <router-outlet />
</ng-container>

<ng-template #withLayout>
  <div
    class="layout"
    [class.role-doctor]="userRole() === 'doctor' || userRole() === 'hospital_admin'"
    [class.role-patient]="userRole() === 'patient'"
    [attr.data-role]="userRole() || 'guest'">

    <!-- Sidebar / Toolbar by role -->
    <ng-container *ngIf="userRole() === 'doctor' || userRole() === 'hospital_admin'; else patientOrGuest">
      <app-toolbar-doctor />
    </ng-container>
    <ng-template #patientOrGuest>
      <ng-container *ngIf="userRole() === 'patient'; else guestToolbar">
        <app-toolbar-patient />
      </ng-container>
      <ng-template #guestToolbar>
        <div class="no-sidebar-placeholder" aria-hidden="true"></div>
      </ng-template>
    </ng-template>

    <!-- Main column -->
    <div class="layout-main">
      <!-- Header -->
      <app-header-content />

      <!-- Routed page content -->
      <main class="content" role="main">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer-content />
    </div>
  </div>
</ng-template>
