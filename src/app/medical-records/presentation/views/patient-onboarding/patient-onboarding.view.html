<div class="patient-onboarding">
    <div class="onboarding-container">
      <!-- Header -->
      <div class="header">
        <h1>Registro de Paciente</h1>
        <p>Complete la información del paciente y sus condiciones médicas</p>
      </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progressPercentage()"></div>
    </div>
    <div class="steps-indicator">
      <span [class.active]="currentStep() >= 1" [class.completed]="currentStep() > 1">1. Información Personal</span>
      <span [class.active]="currentStep() >= 2" [class.completed]="currentStep() > 2">2. Información Médica</span>
      <span [class.active]="currentStep() >= 3">3. Condiciones</span>
    </div>

    <!-- Step 1: Personal Information -->
    <form [formGroup]="personalInfoForm" *ngIf="currentStep() === 1" class="step-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" formControlName="firstName" placeholder="Juan">
        </div>
        <div class="form-group">
          <label>Apellido *</label>
          <input type="text" formControlName="lastName" placeholder="Pérez">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" formControlName="email" placeholder="juan@example.com">
        </div>
        <div class="form-group">
          <label>Contraseña *</label>
          <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label>DNI *</label>
          <input type="text" formControlName="dni" placeholder="12345678">
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento *</label>
          <input type="date" formControlName="birthDate">
        </div>
        <div class="form-group">
          <label>Género *</label>
          <select formControlName="gender">
            <option value="">Seleccione...</option>
            <option value="male">Masculino</option>
            <option value="female">Femenino</option>
            <option value="other">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="tel" formControlName="phone" placeholder="+51 999 888 777">
        </div>
        <div class="form-group full-width">
          <label>Dirección</label>
          <input type="text" formControlName="address" placeholder="Av. Principal 123">
        </div>
      </div>
    </form>

    <!-- Step 2: Medical Information -->
    <form [formGroup]="medicalInfoForm" *ngIf="currentStep() === 2" class="step-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Peso (kg)</label>
          <input type="number" formControlName="weight" placeholder="70">
        </div>
        <div class="form-group">
          <label>Altura (m)</label>
          <input type="number" step="0.01" formControlName="height" placeholder="1.75">
        </div>
        <div class="form-group full-width">
          <h3>Contacto de Emergencia</h3>
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" formControlName="emergencyContactName" placeholder="María Pérez">
        </div>
        <div class="form-group">
          <label>Relación</label>
          <input type="text" formControlName="emergencyContactRelationship" placeholder="Esposa">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" formControlName="emergencyContactPhone" placeholder="+51 999 777 666">
        </div>
      </div>
    </form>

    <!-- Step 3: Conditions -->
    <div *ngIf="currentStep() === 3" class="step-form">
      <h3>Seleccione las condiciones médicas del paciente</h3>
      <div class="conditions-grid">
        <button 
          *ngFor="let condition of availableConditions"
          type="button"
          class="condition-btn"
          [class.selected]="isConditionSelected(condition.id)"
          (click)="toggleCondition(condition.id)">
          <span class="material-icons">{{ isConditionSelected(condition.id) ? 'check_circle' : 'radio_button_unchecked' }}</span>
          {{ condition.name }}
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="alert alert-success" *ngIf="successMessage()">
      <span class="material-icons">check_circle</span>
      {{ successMessage() }}
    </div>
    <div class="alert alert-error" *ngIf="errorMessage()">
      <span class="material-icons">error</span>
      {{ errorMessage() }}
    </div>

    <!-- Navigation Buttons -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="prevStep()" *ngIf="currentStep() > 1">
        Anterior
      </button>
      <button type="button" class="btn-primary" (click)="nextStep()" *ngIf="currentStep() < totalSteps">
        Siguiente
      </button>
      <button type="button" class="btn-primary" (click)="onSubmit()" *ngIf="currentStep() === totalSteps" [disabled]="isSubmitting()">
        <span class="spinner-small" *ngIf="isSubmitting()"></span>
        {{ isSubmitting() ? 'Registrando...' : 'Registrar Paciente' }}
      </button>
    </div>
    </div>
</div>
