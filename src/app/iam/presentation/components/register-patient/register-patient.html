<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>Registro de Paciente</h1>
      <p>Crea tu cuenta personal en ChroniCaree</p>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-steps">
      <div class="step" [class.active]="currentStep() === 1" [class.completed]="currentStep() > 1">
        <div class="step-circle">1</div>
        <span>Cuenta</span>
      </div>
      <div class="step-line" [class.completed]="currentStep() > 1"></div>
      <div class="step" [class.active]="currentStep() === 2" [class.completed]="currentStep() > 2">
        <div class="step-circle">2</div>
        <span>Datos Personales</span>
      </div>
      <div class="step-line" [class.completed]="currentStep() > 2"></div>
      <div class="step" [class.active]="currentStep() === 3">
        <div class="step-circle">3</div>
        <span>Plan</span>
      </div>
    </div>

    <!-- Error Message -->
    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <!-- Step 1: Account Info -->
    @if (currentStep() === 1) {
      <div class="form-step">
        <h2>Información de la Cuenta</h2>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            [value]="form().email"
            (input)="updateForm('email', $any($event.target).value)"
            placeholder="tu@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            [value]="form().password"
            (input)="updateForm('password', $any($event.target).value)"
            placeholder="Mínimo 8 caracteres"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            [value]="form().confirmPassword"
            (input)="updateForm('confirmPassword', $any($event.target).value)"
            placeholder="Repite la contraseña"
            required
          />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" [routerLink]="['/iam/register']">
            Cancelar
          </button>
          <button type="button" class="btn-primary" (click)="onNextStep()">
            Siguiente
          </button>
        </div>
      </div>
    }

    <!-- Step 2: Personal Info -->
    @if (currentStep() === 2) {
      <div class="form-step">
        <h2>Datos Personales</h2>
        
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Nombres</label>
            <input
              type="text"
              id="firstName"
              [value]="form().firstName"
              (input)="updateForm('firstName', $any($event.target).value)"
              placeholder="Ej: Juan"
              required
            />
          </div>

          <div class="form-group">
            <label for="lastName">Apellidos</label>
            <input
              type="text"
              id="lastName"
              [value]="form().lastName"
              (input)="updateForm('lastName', $any($event.target).value)"
              placeholder="Ej: Pérez"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dni">DNI</label>
            <input
              type="text"
              id="dni"
              [value]="form().dni"
              (input)="updateForm('dni', $any($event.target).value)"
              placeholder="12345678"
              required
            />
          </div>

          <div class="form-group">
            <label for="birthDate">Fecha de Nacimiento</label>
            <input
              type="date"
              id="birthDate"
              [value]="form().birthDate"
              (input)="updateForm('birthDate', $any($event.target).value)"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="gender">Género</label>
          <select
            id="gender"
            [value]="form().gender"
            (change)="updateForm('gender', $any($event.target).value)"
            required
          >
            <option value="male">Masculino</option>
            <option value="female">Femenino</option>
            <option value="other">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input
            type="tel"
            id="phone"
            [value]="form().phone"
            (input)="updateForm('phone', $any($event.target).value)"
            placeholder="+51 999 888 777"
            required
          />
        </div>

        <div class="form-group">
          <label for="address">Dirección</label>
          <input
            type="text"
            id="address"
            [value]="form().address"
            (input)="updateForm('address', $any($event.target).value)"
            placeholder="Ej: Av. Arequipa 1234, Lima"
            required
          />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="previousStep()">
            Atrás
          </button>
          <button 
            type="button" 
            class="btn-primary" 
            (click)="onNextStep()"
          >
            Siguiente
          </button>
        </div>
      </div>
    }

    <!-- No inline plan selection during registration. After completing personal data, the user will be redirected to the subscription flow. -->

    <!-- Footer -->
    <div class="register-footer">
      <p>¿Ya tienes cuenta? <a [routerLink]="['/iam/login']">Iniciar Sesión</a></p>
    </div>
  </div>
</div>
