<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <h1>Bienvenido de nuevo</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <!-- Quick Access Buttons removed per request -->

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          [value]="form().email"
          (input)="updateForm('email', $any($event.target).value)"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [value]="form().password"
          (input)="updateForm('password', $any($event.target).value)"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="form().rememberMe"
            (change)="updateForm('rememberMe', $any($event.target).checked)"
          />
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p>¿No tienes cuenta? <a [routerLink]="['/iam/register']">Regístrate aquí</a></p>
      <p><a [routerLink]="['/home']">Volver al inicio</a></p>
    </div>
  </div>
</div>
