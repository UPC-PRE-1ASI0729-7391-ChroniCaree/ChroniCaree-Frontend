<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Iniciar Sesión</h1>
      <p>Ingresa a tu cuenta de ChroniCaree</p>
    </div>

    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          [value]="form().email"
          (input)="updateForm('email', $any($event.target).value)"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [value]="form().password"
          (input)="updateForm('password', $any($event.target).value)"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="form().rememberMe"
            (change)="updateForm('rememberMe', $any($event.target).checked)"
          />
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p>¿No tienes cuenta? <a [routerLink]="['/iam/register/hospital']">Registra tu hospital</a></p>
      <p><a [routerLink]="['/home']">Volver al inicio</a></p>
    </div>
  </div>
</div>
